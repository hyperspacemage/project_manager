{% extends 'tasks/base.html' %}

{% block title %}Edit Task - {{ task.title }}{% endblock %}

{% block content %}
<h2>Edit Task: {{ task.title }}</h2>

<form action="{% url 'edit_task' project_id task.id %}" method="POST">
    {% csrf_token %}
    <div>
        <label>Task Title:</label><br>
        <input type="text" name="title" value="{{ task.title }}" required minlength="3" class="form-input-large">
    </div>
    <br>
    <div>
        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40">{{ task.description }}</textarea>
    </div>
    <br>
    <div>
        <label>Status:</label>
        <select name="status">
            {% for status in statuses %}
            <option value="{{ status }}" {% if task.status == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div>
        <label>Priority Level:</label>
        <select name="priority">
            <option value="">-- Select Priority --</option>
            {% for p in priorities %}
            <option value="{{ p.id }}" {% if task.priority and task.priority.id == p.id %}selected{% endif %}>{{ p.level }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div>
        <label>Assign To:</label>
        <select name="assigned_to">
            <option value="">-- Unassigned --</option>
            {% for member in members %}
            <option value="{{ member.id }}" {% if task.assigned_to and task.assigned_to.id == member.id %}selected{% endif %}>{{ member.username }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div>
        <label>Due Date:</label>
        <input type="datetime-local" name="due_date" value="{{ formatted_due_date }}">
    </div>
    <br>
    <button type="submit">Save Changes</button>
    <a href="{% url 'project_detail' project_id %}">Cancel</a>
</form>
{% endblock %}
