{% extends 'tasks/base.html' %}

{% block title %}Create Task - {{ project.name }}{% endblock %}

{% block content %}
<h2>Add New Task to "{{ project.name }}"</h2>

<form action="{% url 'create_task' project.id %}" method="POST">
    {% csrf_token %}
    <div>
        <label>Task Title:</label><br>
        <input type="text" name="title" required minlength="3" class="form-input-large">
    </div>
    <br>
    <div>
        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40"></textarea>
    </div>
    <br>
    <div>
        <label>Priority Level:</label>
        <select name="priority">
            <option value="">-- Select Priority --</option>
            {% for p in priorities %}
            <option value="{{ p.id }}">{{ p.level }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div>
        <label>Assign To:</label>
        <select name="assigned_to">
            <option value="">-- Unassigned --</option>
            {% for member in members %}
            <option value="{{ member.id }}">{{ member.username }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div>
        <label>Due Date:</label>
        <input type="datetime-local" name="due_date">
    </div>
    <br>
    <button type="submit">Create Task</button>
    <a href="{% url 'project_detail' project.id %}">Cancel</a>
</form>
{% endblock %}
