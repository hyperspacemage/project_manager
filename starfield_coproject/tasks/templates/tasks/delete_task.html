{% extends 'tasks/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<h2>Delete Task</h2>
<p>Are you sure you want to delete the task <strong>"{{ task.title }}"</strong>?</p>
<p class="text-danger">This action cannot be undone.</p>

<form action="{% url 'delete_task' project_id task.id %}" method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete Task</button>
    <a href="{% url 'project_detail' project_id %}">Cancel</a>
</form>
{% endblock %}
